<style>
  :root{
    --bg-night:#171526; --bg-panel:#241F3D; --bg-panel-raised:#2E2850;
    --parchment:#F1E4C3; --amber:#E8A33D; --amber-dim:#7A5A2A;
    --ale:#5B8DEF; --ale-dim:#2E4C8A; --aline:#E37FA1; --aline-dim:#7A3F52;
    --ink:#171526; --outline:#0D0B18;
    --hogar:#C97A4A; --vitalidad:#6FA287; --mente:#5FA8C7; --alegria:#F2C94C; --union:#D96FB0; --jardin:#6FBF73;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg-night);color:var(--parchment);font-family:'VT323',monospace;font-size:19px;min-height:100vh;display:flex;justify-content:center;}
  .pixel{font-family:'Press Start 2P',monospace;}
  .app{width:100%;max-width:420px;min-height:100vh;background:var(--bg-night);border-left:2px solid var(--outline);border-right:2px solid var(--outline);position:relative;overflow-x:hidden;padding-bottom:150px;}

  /* --- top bar: minimal --- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;}
  .topbar-right{display:flex;align-items:center;gap:9px;}
  .who-badge{font-size:14px;padding:5px 9px;border:2px solid var(--outline);background:var(--bg-panel);white-space:nowrap;}
  .who-badge.ale{color:var(--ale);border-color:var(--ale-dim);}
  .who-badge.aline{color:var(--aline);border-color:var(--aline-dim);}
  .crest{font-size:10px;color:var(--amber);letter-spacing:1px;line-height:1.5;}
  .crest em{display:block;font-style:normal;font-size:7px;opacity:.75;letter-spacing:2px;margin-bottom:3px;}
  .icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg-panel);color:var(--parchment);border:2px solid var(--outline);cursor:pointer;}
  .icon-btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}

  .screen{display:none;padding:0 16px;}
  .screen.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* Accesibilidad: foco visible en todo lo interactivo */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--amber); outline-offset:2px;
  }
  /* Movimiento reducido: nada se mueve por su cuenta */
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important; scroll-behavior:auto !important;
    }
  }

  /* ===== SCREEN 1: kingdom ===== */
  .kingdom{border:2px solid var(--outline);box-shadow:0 4px 0 var(--outline);position:relative;overflow:hidden;background:#5a8f4e;}
  .map-stage{position:relative;width:100%;height:min(58vh,520px);overflow:hidden;background:#5a8f4e;touch-action:none;cursor:grab;}
  .map-stage:active{cursor:grabbing;}
  .map-stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  .map-zone{position:absolute;left:0;right:0;top:12px;margin:0;text-align:center;font-family:'Press Start 2P',monospace;font-size:10px;color:#fff;text-shadow:0 2px 0 var(--outline),0 0 10px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .5s;letter-spacing:1px;}
  .map-hint{position:absolute;left:0;right:0;bottom:8px;margin:0;text-align:center;font-size:13px;color:var(--parchment);opacity:.55;pointer-events:none;transition:opacity .4s;}
  .map-daynight{position:absolute;right:8px;top:8px;width:40px;height:40px;font-size:18px;background:rgba(13,11,24,.66);color:#fff;border:2px solid var(--outline);cursor:pointer;}
  .map-daynight:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
  .map-loading{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--parchment);background:#5a8f4e;}

  .prosperity-track{height:14px;background:var(--outline);border:2px solid var(--outline);border-top:none;}
  .prosperity-fill{height:100%;width:0%;background:repeating-linear-gradient(90deg,var(--amber) 0 8px,#f0b862 8px 16px);transition:width .7s cubic-bezier(.2,.9,.3,1.3);}
  @media (prefers-reduced-motion:reduce){.prosperity-fill{transition:none;}}

  .kingdom-line{text-align:center;margin-top:12px;font-size:21px;}
  .kingdom-line b{color:var(--amber);}
  .kingdom-sub{text-align:center;font-size:15px;opacity:.55;margin-top:3px;}
  .draft-note-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .draft-dismiss{flex:none;background:none;border:none;color:var(--amber);font-family:'VT323',monospace;font-size:18px;cursor:pointer;line-height:1;padding:2px 4px;}
  .draft-dismiss:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}


  /* ===== SCREEN 2: us ===== */
  .screen-title{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--amber);margin:4px 0 14px;}
  .moods{display:flex;gap:8px;margin-bottom:16px;}
  .mood-card{flex:1;min-width:0;background:var(--bg-panel);border:2px solid var(--outline);box-shadow:0 4px 0 var(--outline);padding:9px 10px;cursor:pointer;color:var(--parchment);font-family:'VT323',monospace;text-align:left;}
  .mood-card:active{box-shadow:0 2px 0 var(--outline);transform:translateY(2px);}
  .mood-card.ale{border-left:5px solid var(--ale);} .mood-card.aline{border-left:5px solid var(--aline);}
  .mood-card.needs-care{border-color:var(--amber);box-shadow:0 4px 0 var(--amber-dim);}
  .mood-owner{font-size:12px;opacity:.55;}
  .mood-value{font-size:17px;line-height:1.2;margin-top:2px;display:flex;gap:6px;align-items:flex-start;}
  .mood-emoji{font-size:19px;flex:none;}
  .mood-cta{font-size:12px;color:var(--amber);margin-top:4px;min-height:14px;}

  .team{display:flex;flex-direction:column;gap:12px;}
  .char-card{background:var(--bg-panel);border:2px solid var(--outline);box-shadow:0 4px 0 var(--outline);padding:11px;position:relative;}
  .char-card.leveling{animation:levelPulse .7s ease;}
  @keyframes levelPulse{0%{transform:scale(1);}30%{transform:scale(1.03);}100%{transform:scale(1);}}
  .char-top{display:flex;gap:11px;align-items:center;margin-bottom:9px;}
  .avatar{width:48px;height:48px;flex:none;background:var(--bg-night);border:2px solid var(--outline);display:flex;align-items:center;justify-content:center;font-size:23px;position:relative;}
  .avatar.ale{box-shadow:inset 0 0 0 3px var(--ale-dim);} .avatar.aline{box-shadow:inset 0 0 0 3px var(--aline-dim);}
  .lvl-badge{position:absolute;bottom:-8px;right:-8px;font-family:'Press Start 2P',monospace;font-size:9px;background:var(--amber);color:var(--ink);padding:3px 5px;border:2px solid var(--outline);}
  .char-info{flex:1;min-width:0;}
  .char-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
  .char-name{font-size:21px;} .char-name.ale{color:var(--ale);} .char-name.aline{color:var(--aline);}
  .char-class{font-size:11px;opacity:.55;text-align:right;}
  .last-action{font-size:13px;margin-top:2px;opacity:.85;min-height:16px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;}
  .stat-row{display:flex;align-items:center;gap:6px;}
  .stat-row.focus .stat-label-row span:first-child::after{content:' ★';color:var(--amber);font-size:11px;}
  .stat-icon{font-size:14px;flex:none;width:17px;text-align:center;}
  .stat-body{flex:1;min-width:0;}
  .stat-label-row{display:flex;justify-content:space-between;font-size:12px;opacity:.7;}
  .stat-track{height:6px;background:var(--outline);border:1px solid var(--outline);margin-top:2px;}
  .stat-fill{height:100%;transition:width .5s ease;}
  .stat-fill.hogar{background:var(--hogar);} .stat-fill.vitalidad{background:var(--vitalidad);}
  .stat-fill.mente{background:var(--mente);} .stat-fill.alegria{background:var(--alegria);}
  .stat-fill.union{background:var(--union);} .stat-fill.jardin{background:var(--jardin);}
  .burst{position:absolute;inset:0;pointer-events:none;overflow:visible;}
  .burst span{position:absolute;width:6px;height:6px;top:50%;left:50%;opacity:0;}
  .char-card.leveling .burst span{animation:pop .6s ease forwards;}
  @keyframes pop{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:var(--tx) scale(.4);}}

  /* ===== SCREEN 3: feed ===== */
  .forgets{text-align:center;font-size:14px;opacity:.42;margin:14px 0 4px;}
  .draft-note{border:2px dashed var(--amber-dim);background:rgba(232,163,61,.07);padding:11px 13px;margin-bottom:16px;}
  .draft-note h3{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--amber);margin:0 0 7px;line-height:1.5;}
  .draft-note p{margin:0;font-size:15px;opacity:.8;line-height:1.3;}
  .board-note{font-size:14px;opacity:.5;margin:0 0 12px;line-height:1.3;}
  .board{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .board-item{background:var(--bg-panel);border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline);padding:11px 12px;border-left:5px solid var(--amber);display:flex;gap:10px;align-items:flex-start;}
  .board-item.fresh{animation:pin .45s cubic-bezier(.2,.9,.3,1.5);}
  @keyframes pin{0%{transform:scale(.9) rotate(-2deg);opacity:0;}100%{transform:none;opacity:1;}}
  .board-body{flex:1;min-width:0;}
  .board-text{font-size:18px;line-height:1.25;}
  .board-meta{font-size:12px;opacity:.5;margin-top:3px;}
  .picker-label{font-size:14px;opacity:.6;margin-bottom:6px;}
  .board-do{flex:none;background:var(--amber);color:var(--ink);border:2px solid var(--outline);box-shadow:0 3px 0 var(--amber-dim);font-family:'VT323',monospace;font-size:15px;padding:7px 11px;cursor:pointer;}
  .board-do:active{box-shadow:0 1px 0 var(--amber-dim);transform:translateY(2px);}
  .board-add{width:100%;background:none;border:2px dashed var(--amber-dim);color:var(--amber);font-family:'VT323',monospace;font-size:17px;padding:13px;cursor:pointer;}
  .board-input{width:100%;background:var(--bg-night);border:2px solid var(--outline);color:var(--parchment);font-family:'VT323',monospace;font-size:19px;padding:11px;margin-bottom:12px;}
  .board-input::placeholder{color:var(--parchment);opacity:.35;}
  .stat-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .stat-pick{background:var(--bg-panel-raised);border:2px solid var(--outline);color:var(--parchment);font-family:'VT323',monospace;font-size:16px;padding:9px;cursor:pointer;opacity:.55;}
  .stat-pick.on{opacity:1;border-color:var(--amber);}
  .feed{display:flex;flex-direction:column;gap:10px;}
  .feed-empty{font-size:16px;opacity:.45;padding:8px 0;}
  .feed-item{background:var(--bg-panel);border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline);padding:10px 11px;border-left-width:5px;}
  .feed-item.ale{border-left-color:var(--ale);} .feed-item.aline{border-left-color:var(--aline);}
  .feed-line{font-size:17px;line-height:1.35;} .feed-line b{color:var(--amber);}
  .feed-who.ale{color:var(--ale);} .feed-who.aline{color:var(--aline);}
  .feed-time{font-size:12px;opacity:.45;margin-top:2px;}
  .feed-plain{font-size:13px;opacity:.6;margin-top:3px;}
  .feed-plain b{color:var(--amber);opacity:.85;}
  .react-bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .react-btn{background:var(--bg-panel-raised);border:2px solid var(--outline);color:var(--parchment);font-family:'VT323',monospace;font-size:15px;padding:4px 9px;cursor:pointer;}
  .react-btn.emoji{font-size:17px;padding:3px 8px;}
  .reactions{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center;}
  .reaction-chip{background:var(--bg-panel-raised);border:2px solid var(--outline);padding:3px 8px;font-size:15px;animation:chipIn .35s cubic-bezier(.2,.9,.3,1.4);}
  .reaction-chip.hype{color:var(--amber);} .reaction-chip.letter{color:var(--aline);cursor:pointer;}
  @keyframes chipIn{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* ===== Primary CTA + tab bar ===== */
  .bottom{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:15;}
  .cta-wrap{width:100%;max-width:420px;padding:0 16px 10px;background:linear-gradient(to top,var(--bg-night) 62%,transparent);}
  .cta-inner{display:flex;gap:8px;}
  .cta{flex:1;font-family:'Press Start 2P',monospace;font-size:12px;color:var(--ink);background:var(--amber);border:2px solid var(--outline);box-shadow:0 5px 0 var(--amber-dim);padding:17px 10px;cursor:pointer;}
  .cta:active{box-shadow:0 2px 0 var(--amber-dim);transform:translateY(3px);}
  .cta-secondary{flex:none;width:58px;font-size:22px;background:var(--aline-dim);color:#fff;border:2px solid var(--outline);box-shadow:0 5px 0 #4d2634;cursor:pointer;font-family:'VT323',monospace;}
  .cta-secondary:active{box-shadow:0 2px 0 #4d2634;transform:translateY(3px);}

  .tabbar{width:100%;max-width:420px;display:flex;background:var(--bg-panel);border-top:2px solid var(--outline);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;background:none;border:none;cursor:pointer;padding:9px 4px 11px;color:var(--parchment);font-family:'VT323',monospace;opacity:.45;border-top:3px solid transparent;}
  .tab.active{opacity:1;border-top-color:var(--amber);background:var(--bg-panel-raised);}
  .tab-icon{font-size:21px;display:block;}
  .tab-label{font-size:13px;display:block;margin-top:1px;}
  .tab-dot{display:inline-block;width:7px;height:7px;background:var(--amber);margin-left:4px;vertical-align:middle;}

  /* ===== Sheets, notifs, letter, chest ===== */
  .sheet-overlay{position:fixed;inset:0;background:rgba(10,8,20,.72);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;}
  .sheet-overlay.open{opacity:1;pointer-events:all;}
  .sheet{width:100%;max-width:420px;background:var(--bg-panel);border-top:2px solid var(--outline);padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1.1);max-height:82vh;overflow-y:auto;}
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-title{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--amber);margin-bottom:14px;line-height:1.6;}
  .cat-group{margin-bottom:16px;}
  .cat-header{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:8px;opacity:.85;}
  .cat-dot{width:9px;height:9px;flex:none;}
  .cat-dot.hogar{background:var(--hogar);} .cat-dot.vitalidad{background:var(--vitalidad);}
  .cat-dot.mente{background:var(--mente);} .cat-dot.alegria{background:var(--alegria);}
  .cat-dot.union{background:var(--union);} .cat-dot.jardin{background:var(--jardin);}
  .focus-tag{margin-left:auto;font-size:12px;color:var(--amber);border:2px solid var(--amber-dim);padding:1px 6px;}
  .task-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .task-tile{background:var(--bg-panel-raised);border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline);padding:12px 10px;text-align:left;cursor:pointer;color:var(--parchment);font-family:'VT323',monospace;border-left-width:5px;}
  .task-tile.hogar{border-left-color:var(--hogar);} .task-tile.vitalidad{border-left-color:var(--vitalidad);}
  .task-tile.mente{border-left-color:var(--mente);} .task-tile.alegria{border-left-color:var(--alegria);}
  .task-tile.union{border-left-color:var(--union);} .task-tile.jardin{border-left-color:var(--jardin);}
  .task-tile:active{box-shadow:0 1px 0 var(--outline);transform:translateY(2px);}
  .task-icon{font-size:22px;} .task-name{font-size:17px;margin-top:4px;} .task-pts{font-size:13px;margin-top:2px;opacity:.8;}
  .msg-list{display:flex;flex-direction:column;gap:9px;}
  .msg-tile{background:var(--bg-panel-raised);border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline);padding:12px;text-align:left;cursor:pointer;color:var(--parchment);font-family:'VT323',monospace;font-size:18px;display:flex;align-items:center;gap:10px;}
  .msg-tile:active{box-shadow:0 1px 0 var(--outline);transform:translateY(2px);}
  .msg-tile.love{border-left:5px solid var(--aline);} .msg-tile.hype{border-left:5px solid var(--amber);}
  .msg-emoji{font-size:22px;flex:none;}
  .sheet-close{display:block;width:100%;text-align:center;margin-top:12px;background:none;border:2px solid var(--outline);color:var(--parchment);font-family:'VT323',monospace;font-size:16px;padding:10px;cursor:pointer;opacity:.7;}

  .notif-zone{position:fixed;top:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;}
  .notif{width:calc(100% - 32px);max-width:388px;background:var(--bg-panel-raised);border:2px solid var(--outline);box-shadow:0 5px 0 var(--outline);padding:10px 12px;display:flex;align-items:center;gap:10px;transform:translateY(-160%);opacity:0;transition:transform .4s cubic-bezier(.2,.8,.3,1.2),opacity .3s;}
  .notif.show{transform:translateY(0);opacity:1;}
  .notif.love{border-color:var(--aline);box-shadow:0 5px 0 var(--aline-dim);}
  .notif.build{border-color:var(--amber);box-shadow:0 5px 0 var(--amber-dim);}
  .notif-icon{font-size:22px;flex:none;} .notif-text{font-size:15px;line-height:1.3;} .notif-text b{color:var(--amber);}
  .notif-sub{font-size:12px;opacity:.55;}

  .letter-overlay{position:fixed;inset:0;background:rgba(10,8,20,.85);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
  .letter-overlay.open{opacity:1;pointer-events:all;}
  .letter{width:100%;max-width:340px;background:linear-gradient(#F6EBCD,#E8D8AE);color:#3B2A17;border:3px solid #8A6A3A;box-shadow:0 8px 0 rgba(0,0,0,.5);padding:26px 22px;text-align:center;transform:scale(.7) rotate(-3deg);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.5),opacity .3s;position:relative;}
  .letter-overlay.open .letter{transform:scale(1) rotate(0);opacity:1;}
  .letter::before,.letter::after{content:"";position:absolute;left:-3px;right:-3px;height:10px;background:repeating-linear-gradient(90deg,#8A6A3A 0 6px,transparent 6px 12px);}
  .letter::before{top:-3px;} .letter::after{bottom:-3px;}
  .letter-seal{font-size:34px;margin-bottom:10px;}
  .letter-from{font-size:14px;opacity:.65;margin-bottom:12px;letter-spacing:1px;}
  .letter-body{font-size:26px;line-height:1.35;}
  .letter-close{margin-top:18px;background:#8A6A3A;color:#F6EBCD;border:2px solid #5C4523;font-family:'VT323',monospace;font-size:17px;padding:9px 22px;cursor:pointer;}

  .chest-overlay{position:fixed;inset:0;background:rgba(10,8,20,.92);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:50;}
  .chest-overlay.open{opacity:1;pointer-events:all;}
  .chest-stage{text-align:center;width:100%;max-width:340px;}
  .chest-icon{font-size:86px;display:inline-block;cursor:pointer;animation:chestIdle 1.6s ease-in-out infinite;background:none;border:none;padding:0;color:inherit;line-height:1;}
  @keyframes chestIdle{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-7px) scale(1.04);}}

  @keyframes chestBurst{0%{transform:scale(1);}40%{transform:scale(1.3) rotate(-4deg);}100%{transform:scale(1.05);}}
  .chest-hint{font-size:19px;opacity:.7;margin-top:14px;}
  .chest-reward{margin-top:18px;background:linear-gradient(#F6EBCD,#E8D8AE);color:#3B2A17;border:3px solid #8A6A3A;box-shadow:0 8px 0 rgba(0,0,0,.5);padding:22px 18px;opacity:0;transform:scale(.8);transition:opacity .4s .25s,transform .5s .25s cubic-bezier(.2,.9,.3,1.5);}

  .chest-reward-label{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:1px;opacity:.7;margin-bottom:12px;}
  .chest-reward-text{font-size:27px;line-height:1.3;}
  .chest-close{margin-top:20px;background:var(--amber);color:var(--ink);border:2px solid var(--outline);box-shadow:0 4px 0 var(--amber-dim);font-family:'Press Start 2P',monospace;font-size:10px;padding:13px 20px;cursor:pointer;}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:51;overflow:hidden;}
  .confetti i{position:absolute;width:7px;height:7px;top:-12px;opacity:0;animation:fall 2.4s linear forwards;}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0);}100%{opacity:0;transform:translateY(104vh) rotate(540deg);}}

  /* ===== Settings sheet ===== */
  .set-group{margin-bottom:20px;}
  .set-group h3{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--amber);margin:0 0 10px;line-height:1.6;}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(241,228,195,.12);}
  .set-row:last-child{border-bottom:none;}
  .set-row label{font-size:16px;flex:1;min-width:0;}
  .set-seg{display:flex;border:2px solid var(--outline);}
  .set-seg button{font-family:'VT323',monospace;font-size:14px;padding:6px 10px;border:none;cursor:pointer;background:var(--bg-panel);color:var(--parchment);opacity:.55;min-height:36px;}
  .set-seg button[aria-pressed="true"]{opacity:1;background:var(--amber-dim);}
  .set-seg button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}
  .set-num{width:64px;background:var(--bg-night);border:2px solid var(--outline);color:var(--parchment);font-family:'VT323',monospace;font-size:17px;padding:6px;text-align:center;}
  .set-task{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .set-task .t-ico{font-size:18px;flex:none;width:22px;text-align:center;}
  .set-task .t-name{flex:1;min-width:0;font-size:15px;}
  .set-reward-input{width:100%;background:var(--bg-night);border:2px solid var(--outline);color:var(--parchment);font-family:'VT323',monospace;font-size:15px;padding:8px;margin-bottom:6px;}
  .set-hint{font-size:13px;opacity:.5;line-height:1.35;margin:4px 0 0;}
  .set-focus-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .set-focus-pick button{font-family:'VT323',monospace;font-size:14px;padding:8px;border:2px solid var(--outline);background:var(--bg-panel-raised);color:var(--parchment);opacity:.55;cursor:pointer;min-height:40px;}
  .set-focus-pick button[aria-pressed="true"]{opacity:1;border-color:var(--amber);}

<div class="app">
  <div class="notif-zone" id="notifZone" aria-live="polite" aria-atomic="false"></div>

          aria-label="Cambiar entre día y noche">🌙</button>

        <p class="map-loading" id="mapLoading">Levantando el reino…</p>
      </div>
      <div class="prosperity-track" role="progressbar" id="prospBar"
        aria-label="Prosperidad del reino" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="prosperity-fill" id="prospFill"></div>
      </div>
    </div>
    <p class="kingdom-line"><b id="prospPts">0</b> <span id="prospLabel"></span></p>
    <p class="kingdom-sub" id="nextBuild"></p>

  <!-- SCREEN 2 -->

  <!-- SCREEN 3 -->

    </div></div>

      <button class="tab active" type="button" data-screen="kingdom" aria-current="page"><span class="tab-icon" aria-hidden="true">🏰</span><span class="tab-label" id="tabKingdom"></span></button>
      <button class="tab" data-screen="us"><span class="tab-icon">👑</span><span class="tab-label" id="tabUs"></span><span id="usDot"></span></button>
      <button class="tab" data-screen="board"><span class="tab-icon">📋</span><span class="tab-label" id="tabBoard"></span><span id="boardDot"></span></button>
      <button class="tab" data-screen="log"><span class="tab-icon">📜</span><span class="tab-label" id="tabLog"></span><span id="logDot"></span></button>
    </nav>
  </div>

  <div class="sheet-overlay" id="taskOverlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="taskSheetTitle">

    <button class="sheet-close" id="closeTask" type="button"></button>
  </div></div>
  <div class="sheet-overlay" id="msgOverlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="msgSheetTitle">
    <div class="sheet-title pixel" id="msgSheetTitle"></div><div class="msg-list" id="msgBody"></div>
    <button class="sheet-close" id="closeMsg" type="button"></button>
  </div></div>
  <div class="sheet-overlay" id="moodOverlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="moodSheetTitle">
    <div class="sheet-title pixel" id="moodSheetTitle"></div><div class="msg-list" id="moodBody"></div>
    <button class="sheet-close" id="closeMood" type="button"></button>
  </div></div>
  <div class="sheet-overlay" id="boardOverlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="boardSheetTitle">
    <div class="sheet-title pixel" id="boardSheetTitle"></div>

    <button class="cta" id="boardPost" style="width:100%"></button>

  </div></div>

    <div class="sheet-title pixel" id="settingsTitle"></div>
    <div id="settingsBody"></div>
    <button class="sheet-close" id="closeSettings"></button>
  </div></div>

  <div class="letter-overlay" id="letterOverlay"><div class="letter" role="dialog" aria-modal="true" aria-labelledby="letterBody">
    <div class="letter-seal" aria-hidden="true">💌</div><div class="letter-from" id="letterFrom"></div>
    <div class="letter-body" id="letterBody"></div>
    <button class="letter-close" id="letterClose" type="button"></button>
  </div></div>
  <div class="chest-overlay" id="chestOverlay"><div class="chest-stage" role="dialog" aria-modal="true" aria-label="Cofre del reino">
    <button class="chest-icon" id="chestIcon" type="button" aria-label="Abrir el cofre">🎁</button>

    </div>

  </div></div>
</div>

function cronica(who, task, lang){
  const c = CRONICAS[task.id];
  if(!c) return NAMES[who];
  return c[lang].replace('{R}', TITLES[who][lang]);
}

const REST_TARGET = 70;
const RELIEF_MULT = 1.5;

const DAY_MS = 86400000;

function freshChar(){
  const c={};
  Object.keys(STATS).forEach(k=>c[k]={xp:0,level:1});
  return c;
}
let state = {
  ale:freshChar(), aline:freshChar(),
  prosperity:0, who:'ale', lang:'es', screen:'kingdom',
  feed:[], nextId:1,
  board:[], nextBoardId:1, unseenBoard:0, pickedStat:'hogar',
  chestClaimed:false, reactTarget:null,

const $ = id => document.getElementById(id);
const t = () => UI[state.lang];
const statName = k => STATS[k][state.lang];
const taskName = x => x[state.lang];
const other = w => w==='ale'?'aline':'ale';

/* --- Where the two systems actually touch each other --- */
// Your partner is low and you are not: covering for them is worth more.
const reliefFor = w => state.moods[other(w)].care && !state.moods[w].care;
// Both of you are low: the realm asks less of you this week.
const restMode = () => state.moods.ale.care && state.moods.aline.care;
const currentTarget = () => restMode() ? REST_TARGET : PROSPERITY_TARGET;
const isFocus = k => FOCUS.includes(k);
function pointsFor(task, who){
  who = who || state.who;
  let p = task.pts;
  if(isFocus(task.stat)) p = Math.round(p*FOCUS_MULT);
  if(reliefFor(who)) p = Math.round(p*RELIEF_MULT);
  return p;
}
function charLevel(c){return Object.keys(STATS).reduce((s,k)=>s+c[k].level,0)-(Object.keys(STATS).length-1);}

      if(on) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current');

    if(state.screen==='log'){ state.unseenFeed=0; renderBadges(); }
    if(state.screen==='board'){ state.unseenBoard=0; renderBadges(); }

  });
});

let lastFocus = null;

  lastFocus = document.activeElement;
  const ov = $(id); ov.classList.add('open');

function renderKingdom(){
  const T=t();
  const pct = Math.min(100, Math.round(state.prosperity/currentTarget()*100));
  $('prospPts').textContent=state.prosperity;
  $('prospFill').style.width=pct+'%';
  const bar=$('prospBar'); bar.setAttribute('aria-valuenow', pct);
  bar.setAttribute('aria-valuetext', state.prosperity+' — '+pct+'%');
  const next=MILESTONES.find(b=>state.prosperity<b.at);
  $('nextBuild').textContent = next ? T.nextBuild+T[next.k]+' · '+next.at : T.kingdomFull;
  if(window.KingdomMap) KingdomMap.setProsperity(state.prosperity);
}
function renderMods(){
  const T=t(), el=$('modStrip');
  el.className='mod-strip';
  if(restMode()){
    el.classList.add('rest');
    $('modIcon').textContent='🌙';
    $('modText').innerHTML='<b>'+T.restOn+'</b> — '+T.restSub+REST_TARGET;
  } else if(reliefFor(state.who)){
    el.classList.add('relief');
    $('modIcon').textContent='🛡️';
    $('modText').innerHTML='<b>'+T.reliefOn+'</b> — '+NAMES[other(state.who)]+' '+T.reliefSub;
  } else {
    el.classList.add('none');
    $('modIcon').textContent='·';
    $('modText').textContent=T.modNone;
  }
}

function renderMoods(){
  const T=t(), wrap=$('moods'); wrap.innerHTML='';
  ['ale','aline'].forEach(who=>{
    const mine=who===state.who, mood=state.moods[who];
    const card=document.createElement('button');
    const invites = !mine && (mood.care || mood.replies);
    card.className='mood-card '+who+(invites?' needs-care':'');
    card.innerHTML='<div class="mood-owner">'+(mine?T.moodMine:NAMES[who])+'</div>'+
      '<div class="mood-value"><span class="mood-emoji">'+mood.emoji+'</span><span>'+mood[state.lang]+'</span></div>'+
      '<div class="mood-cta">'+(mine?T.moodChange:(mood.replies?T.moodReply:(mood.care?T.moodSupport:'')))+'</div>';
    card.addEventListener('click',()=>{
      if(mine){state.moodTarget='self';$('moodSheetTitle').textContent=T.moodSheetTitle;renderMoodSheet('mood');}
      else if(mood.replies){state.moodTarget=who;$('moodSheetTitle').textContent=mood[state.lang];renderMoodSheet(mood.replies);}
      else{state.moodTarget=who;$('moodSheetTitle').textContent=T.careSheetTitle;renderMoodSheet('care');}
      $('moodOverlay').classList.add('open');
    });
    wrap.appendChild(card);

function completeQuest(id){
  const T=t(), i=state.board.findIndex(q=>q.id===id);
  if(i<0) return;
  const q=state.board[i];
  state.board.splice(i,1);

  // A cleared request is a deed like any other — it feeds the realm.
  const who=state.who, st=state[who][q.stat];
  let gained=q.pts;
  if(isFocus(q.stat)) gained=Math.round(gained*FOCUS_MULT);
  if(reliefFor(who)) gained=Math.round(gained*RELIEF_MULT);
  st.xp+=gained;
  state.prosperity=state.prosperity+gained;  // suma real de 7 días, sin recorte (el mapa crece con ella)
  let leveled=false;
  while(st.xp>=XP_PER_LEVEL){st.xp-=XP_PER_LEVEL;st.level++;leveled=true;}

  state.feed.push({id:state.nextId++,type:'quest',who,text:q.text,stat:q.stat,gained,ts:Date.now(),reactions:[]});
  if(state.screen!=='log') state.unseenFeed++;
  Backend.boardClose(id);
  Backend.deed({id:'encargo',stat:q.stat}, gained);   // el encargo resuelto cuenta como hazaña

  renderBoard(); renderKingdom(); renderTeam(); renderFeed(); renderBadges();
  notify(who,'✅ <b>'+NAMES[who]+'</b> '+T.boardCleared+
    '<div style="font-size:14px;margin-top:3px">'+q.text+' +'+gained+' '+statName(q.stat)+'</div>',null);
  if(leveled){
    const card=$('card_'+who);
    if(card){card.classList.add('leveling');burst(who);setTimeout(()=>card.classList.remove('leveling'),700);}
  }
  if(state.prosperity>=currentTarget()&&!state.chestClaimed) setTimeout(openChest,1600);
}

function logTask(task){
  $('taskOverlay').classList.remove('open');
  const T=t(), who=state.who;
  const gained=pointsFor(task, who);
  const st=state[who][task.stat];
  st.xp+=gained;
  const before=state.prosperity;
  state.prosperity=state.prosperity+gained;  // suma real de 7 días, sin recorte (el mapa crece con ella)
  let leveled=false;
  while(st.xp>=XP_PER_LEVEL){st.xp-=XP_PER_LEVEL;st.level++;leveled=true;}
  state.feed.push({id:state.nextId++,type:'task',who,task,gained,ts:Date.now(),reactions:[]});
  if(state.screen!=='log') state.unseenFeed++;
  Backend.deed(task, gained);
  renderKingdom(); renderTeam(); renderFeed(); renderTaskSheet(); renderBadges();
  notify(who,task.icon+' '+cronica(who,task,state.lang)+
    '<div style="font-size:12px;opacity:.6;margin-top:2px">'+NAMES[who]+' · '+taskName(task)+' +'+gained+' '+statName(task.stat)+'</div>',null);
  MILESTONES.filter(b=>before<b.at&&state.prosperity>=b.at).forEach((b,i)=>{
    setTimeout(()=>notify(who,'<b>'+T.built+T[b.k]+'</b>','build'),1200+i*500);
  });

  }

}
function addReaction(itemId,reaction){
  const item=state.feed.find(f=>f.id===itemId); if(!item)return;
  item.reactions.push(reaction); renderFeed();
  const T=t();
  const deedId = (typeof item.id==='string' && item.id[0]==='d') ? +item.id.slice(1) : undefined;
  Backend.message(reaction.kind, reaction.emoji || (reaction.msg && reaction.msg.id), deedId);
  if(reaction.kind==='quick') notify(reaction.from,'<b>'+NAMES[reaction.from]+'</b> '+reaction.emoji,null);
  else if(reaction.kind==='hype') notify(reaction.from,'<b>'+NAMES[reaction.from]+'</b>: '+reaction.msg.emoji+' '+reaction.msg[state.lang],null);
  else notify(reaction.from,'<b>'+NAMES[reaction.from]+'</b> '+T.sentYou+' 💌','love');
}

  $('msgOverlay').classList.remove('open');

  else{
    state.feed.push({id:state.nextId++,type:'hype',who:state.who,msg,ts:Date.now(),reactions:[]});
    Backend.message('hype', msg.id);
    renderFeed(); notify(state.who,'<b>'+NAMES[state.who]+'</b>: '+msg.emoji+' '+msg[state.lang],null);
  }
}

function loadConfig(){
  let cfg={};
  try{ cfg = JSON.parse(localStorage.getItem('ksd_config')||'{}'); }catch(e){}
  if(cfg.taskPts) TASKS.forEach(x=>{ if(typeof cfg.taskPts[x.id]==='number') x.pts=cfg.taskPts[x.id]; });
  if(Array.isArray(cfg.focus) && cfg.focus.length===2){ FOCUS.splice(0,FOCUS.length,...cfg.focus); }
  if(Array.isArray(cfg.rewards) && cfg.rewards.length){
    REWARDS.splice(0,REWARDS.length,...cfg.rewards.map((txt,i)=>({id:'r'+(i+1),es:txt,fr:txt,en:txt})));
  }
  try{ const l=localStorage.getItem('ksd_lang'); if(l&&UI[l]) state.lang=l; }catch(e){}
  try{ const w=localStorage.getItem('ksd_who'); if(w==='ale'||w==='aline') state.who=w; }catch(e){}
}

    taskPts: Object.fromEntries(TASKS.map(x=>[x.id,x.pts])),
    focus: FOCUS.slice(),

      const row=document.createElement('div'); row.className='set-task';
      const inp=document.createElement('input');
      inp.type='number'; inp.min='0'; inp.max='20'; inp.value=task.pts; inp.className='set-num';
      inp.setAttribute('aria-label', taskName(task)+' — puntos');
      inp.addEventListener('change',()=>{
        task.pts = Math.max(0, Math.min(20, parseInt(inp.value,10)||0));
        inp.value = task.pts; saveConfig(); renderAll();
      });
      row.innerHTML='<span class="t-ico" aria-hidden="true">'+task.icon+'</span><span class="t-name">'+taskName(task)+'</span>';
      row.appendChild(inp); tg.appendChild(row);
    });
  });
  body.appendChild(tg);

  // Cofre
  const rg = g('<h3>'+T.rewardsHead+'</h3><p class="set-hint">'+T.rewardsHint+'</p>');
  const ta=document.createElement('textarea');
  ta.className='set-reward-input'; ta.rows=REWARDS.length+1;
  ta.value = REWARDS.map(r=>r[state.lang]).join('\n');
  ta.setAttribute('aria-label', T.rewardsHead);
  ta.addEventListener('change',()=>{
    const lines = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(lines.length){
      REWARDS.splice(0,REWARDS.length,...lines.map((txt,i)=>({id:'r'+(i+1),es:txt,fr:txt,en:txt})));
      saveConfig();
    }
  });
  rg.appendChild(ta); body.appendChild(rg);

  // Reset
  const rb=document.createElement('button');
  rb.className='sheet-close'; rb.type='button'; rb.textContent=T.resetBtn;
  rb.addEventListener('click',()=>{
    TASKS.forEach(x=> x.pts = DEFAULTS.taskPts[x.id]);
    FOCUS.splice(0,FOCUS.length,...DEFAULTS.focus);
    try{ localStorage.removeItem('ksd_config'); }catch(e){}
    renderAll(); renderSettings();
  });
  body.appendChild(rb);

  function seg(label, opts, cur, cb){
    const row=document.createElement('div'); row.className='set-row';
    const lb=document.createElement('label'); lb.textContent=label; row.appendChild(lb);
    const s=document.createElement('div'); s.className='set-seg'; s.setAttribute('role','group'); s.setAttribute('aria-label',label);
    opts.forEach(o=>{
      const val = Array.isArray(o)?o[0]:o, txt = Array.isArray(o)?o[1]:o.toUpperCase();
      const b=document.createElement('button'); b.type='button'; b.textContent=txt;
      b.setAttribute('aria-pressed', val===cur);
      b.addEventListener('click',()=>cb(val));
      s.appendChild(b);
    });
    row.appendChild(s); return row;
  }
}

/* ===================================================================
   BACKEND — capa fina sobre Supabase. Sin credenciales → modo local
   (todo funciona con `state` en este dispositivo, para validar el diseño).
   El cliente vive en supabase-client.js (window.KSD).
   =================================================================== */
const Backend = {
  mode: window.SUPABASE_URL ? 'supabase' : 'local',
  ids: {},        // 'ale'/'aline' -> uuid   (en modo supabase)
  meId: null,     // uuid del que mira

  async connect(){
    if(this.mode!=='supabase') return;
    if(!window.KSD){ console.warn('supabase-client.js no cargó; sigo en local'); this.mode='local'; return; }
    const { user } = await KSD.ready();
    if(!user){ showSignIn(); return false; }
    this.meId = user.id;
    await this.hydrate();
    KSD.subscribe(()=> this.hydrate().then(renderAll));
    KSD.onAuth(a=>{ if(!a) location.reload(); });
    return true;
  },

  // Trae el mundo de Supabase a `state` y a `MOODS`/idioma
  async hydrate(){
    const [profiles, deeds, board, messages, prosp] = await Promise.all([
      KSD.profiles(), KSD.deeds(), KSD.board(), KSD.messages(), KSD.prosperity()
    ]);
    // mapear uuid -> 'ale'/'aline' por orden de nombre (Alejandro / Aline)
    const list = Object.values(profiles).sort((a,b)=> a.name.localeCompare(b.name));
    this.ids = {}; list.forEach((p,i)=> this.ids[ i===0 ? 'ale' : 'aline' ] = p.id);
    const who = uid => this.ids.ale===uid ? 'ale' : 'aline';

    state.who = who(this.meId);
    const meProfile = profiles[this.meId];
    if(meProfile && UI[meProfile.lang]) state.lang = meProfile.lang;
    ['ale','aline'].forEach(k=>{
      const p = profiles[this.ids[k]];
      if(p){ const m = MOODS.find(x=>x.id===p.mood_id); if(m) state.moods[k]=m; }
    });

    state.prosperity = prosp;
    // reconstruir feed desde deeds + messages (ids, nunca texto)
    state.feed = [];
    deeds.forEach(d=>{
      const task = TASKS.find(x=>x.id===d.task_id) || {id:d.task_id,icon:'•',stat:d.stat,es:d.task_id,fr:d.task_id,en:d.task_id};
      state.feed.push({ id:'d'+d.id, type:'task', who:who(d.user_id), task, gained:d.points, ts:+new Date(d.created_at), reactions:[] });
    });
    messages.forEach(m=>{
      const w = who(m.from_user);
      if(m.kind==='care'){ const msg=CARE.find(x=>x.id===m.payload_id); if(msg) state.feed.push({id:'m'+m.id,type:'care',who:w,msg,ts:+new Date(m.created_at),reactions:[]}); }
      else if(m.kind==='letter'){ const msg=LETTERS.find(x=>x.id===m.payload_id); if(msg) state.feed.push({id:'m'+m.id,type:'letter',who:w,msg,ts:+new Date(m.created_at),reactions:[]}); }
      else if(m.kind==='hype'){ const msg=HYPE.find(x=>x.id===m.payload_id); if(msg) state.feed.push({id:'m'+m.id,type:'hype',who:w,msg,ts:+new Date(m.created_at),reactions:[]}); }
      // 'quick' y reacciones a deeds: se resuelven en render (deed_id)
    });
    state.feed.sort((a,b)=> a.ts-b.ts);
    // recomputar niveles desde cero sumando deeds
    state.ale = freshChar(); state.aline = freshChar();
    deeds.slice().reverse().forEach(d=>{
      const c = state[who(d.user_id)][d.stat]; if(!c) return;
      c.xp += d.points;
      while(c.xp>=XP_PER_LEVEL){ c.xp-=XP_PER_LEVEL; c.level++; }
    });
    state.board = board.map(b=>({ id:b.id, text:b.text, stat:b.stat, pts:b.points, by:who(b.created_by), ts:+new Date(b.created_at) }));
  },

  // ---- escrituras (en local no hacen nada; el state ya se actualizó) ----
  deed(task, gained){ if(this.mode==='supabase') KSD.addDeed(task.id, task.stat, gained).catch(console.error); },
  boardAdd(q){ if(this.mode==='supabase') KSD.addBoard(q.text, q.stat, q.pts).catch(console.error); },
  boardClose(id){ if(this.mode==='supabase') KSD.closeBoard(id).catch(console.error); },
  message(kind, payload_id, deed_id){ if(this.mode==='supabase') KSD.addMessage(kind, payload_id, deed_id).catch(console.error); },
  mood(mood_id){ if(this.mode==='supabase') KSD.setMood(mood_id).catch(console.error); },
  lang(l){ if(this.mode==='supabase') KSD.setLang(l).catch(console.error); },
};

/* Sign-in mínimo (solo modo supabase, primera vez) */
function showSignIn(){
  const T=t();
  const ov = document.createElement('div');
  ov.className='sheet-overlay open'; ov.id='signinOverlay';
  ov.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="signinTitle">'+
    '<div class="sheet-title pixel" id="signinTitle">ENTRAR AL REINO</div>'+
    '<input class="board-input" id="siEmail" type="email" autocomplete="email" placeholder="email">'+
    '<input class="board-input" id="siPass" type="password" autocomplete="current-password" placeholder="contraseña">'+
    '<button class="cta" id="siGo" style="width:100%">Entrar</button>'+
    '<p class="set-hint" id="siErr" role="alert"></p></div>';
  document.body.appendChild(ov);
  $('siGo').addEventListener('click', async ()=>{
    const { error } = await KSD.signIn($('siEmail').value.trim(), $('siPass').value);
    if(error){ $('siErr').textContent = error.message; return; }
    Backend.meId = KSD.currentUserId();   // clave: fijar quién soy ANTES de cargar el reino
    ov.remove();
    await Backend.hydrate(); KSD.subscribe(()=> Backend.hydrate().then(renderAll));
    renderAll();
    notify(state.who, '<b>'+NAMES[state.who]+'</b> ha entrado al reino', null);
  });
  $('siEmail').focus();
}

/* ===================================================================
   ARRANQUE
   =================================================================== */
loadConfig();
document.documentElement.lang = state.lang;
renderAll();

function bootMap(){
  if(!window.KingdomMap) return;
  KingdomMap.init($('mapCanvas'), $('mapStage'), {
    onZone: name => { const z=$('mapZone'); z.textContent=name; z.style.opacity=1; clearTimeout(z._t); z._t=setTimeout(()=>z.style.opacity=0,1600); },
  });
  KingdomMap.setProsperity(state.prosperity);
  $('mapDayNight').addEventListener('click',()=>{
    const night = KingdomMap.toggleNight();
    $('mapDayNight').textContent = night ? '🌙' : '☀️';
    $('mapDayNight').setAttribute('aria-pressed', String(night));
  });
  $('mapStage').addEventListener('pointerdown',()=>{ $('mapHint').style.opacity=0; },{once:true});
}
bootMap();
// (el mapa se pausa/reanuda al cambiar de pestaña — ver handler de .tab, ecoconcepción)

// conectar backend (si hay credenciales); supabase-client.js va con defer
window.addEventListener('DOMContentLoaded', ()=>{
  Backend.connect().then(ok=>{ if(ok!==false) renderAll(); }).catch(console.error);
});

// service worker (PWA) — sin bloquear el arranque
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
